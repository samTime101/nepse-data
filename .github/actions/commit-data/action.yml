name: Commit data changes
description: Commit changed CSVs and the company map, then push.

runs:
  using: composite
  steps:
    - name: Commit and push
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git config --local user.email "sam101-nepse-bot@users.noreply.github.com"
        git config --local user.name "Samip's NEPSE BOT"
        git add -- data src/constants/companyIdMap.py
        if git diff --staged --quiet; then
          echo "No data changes to commit."
          exit 0
        fi
        git commit -m "Update data"
        git push origin "HEAD:${GITHUB_REF_NAME}"
