name: Set up scraper environment
description: Install Python 3.8 and the scraper dependencies.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.8"
        cache: pip
        cache-dependency-path: src/requirements.txt

    - name: Install packages
      shell: bash
      working-directory: ${{ github.workspace }}/src
      run: pip install -r requirements.txt
