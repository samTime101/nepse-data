name: discover-companies

on:
  schedule:
    # 18:52 NPT (13:07 UTC), Monday-Friday. Off the hour to avoid GitHub scheduler drops.
    - cron: "7 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nepse-data-write
  cancel-in-progress: false

jobs:
  discover:
    name: discover-companies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Discover companies
        working-directory: ./src
        run: python discoverCompanies.py

      - uses: ./.github/actions/commit-data
