name: update-daily-data

on:
  schedule:
    # 19:22-23:22 NPT (13:37-17:37 UTC), Monday-Friday. Off the half-hour to avoid GitHub scheduler drops.
    - cron: "37 13,14,15,16,17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nepse-data-write
  cancel-in-progress: false

jobs:
  update:
    name: update-daily-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Update daily prices
        working-directory: ./src
        run: python dailyDataScrapper.py

      - uses: ./.github/actions/commit-data
